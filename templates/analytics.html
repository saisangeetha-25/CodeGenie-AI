<!DOCTYPE html>
<html>
<head>

<title>CodeGenie AI - Analytics</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#0f172a;
color:white;
min-height:100vh;
}

.header{
background:#1e293b;
padding:20px;
text-align:center;
border-bottom:1px solid rgba(0,195,255,0.3);
}

.header h1{
color:#00c3ff;
}

.container{
width:90%;
max-width:1200px;
margin:30px auto;
}

.top-card{
background:#1e293b;
padding:25px;
border-radius:15px;
margin-bottom:25px;
border:1px solid rgba(0,195,255,0.2);
text-align:center;
}

.top-card h2{
color:#00c3ff;
margin-bottom:10px;
}

.chart-card{
background:#1e293b;
padding:25px;
border-radius:15px;
border:1px solid rgba(0,195,255,0.2);
}

.back-btn{
display:inline-block;
margin-bottom:20px;
padding:10px 18px;
background:#00c3ff;
color:white;
text-decoration:none;
border-radius:8px;
}

.back-btn:hover{
background:#009ad6;
}

</style>

</head>

<body>

<div class="header">
<h1>📊 Analytics Dashboard</h1>
</div>

<div class="container">

<a href="/admin_dashboard" class="back-btn">
← Back to Dashboard
</a>

<div class="top-card">

<h2>🔥 Most Used Language</h2>

<h3>
{{ top_lang.language if top_lang else "No Data Yet" }}
</h3>

</div>

<div class="chart-card">

<canvas id="chart"></canvas>

</div>

</div>

<script>

const data = {{ data | tojson }};

const labels = data.map(i => i.language);
const counts = data.map(i => i.cnt);

new Chart(document.getElementById("chart"),{

type:'bar',

data:{
labels:labels,

datasets:[{
label:'Codes Generated',
data:counts
}]
},

options:{
responsive:true
}

});

</script>

<footer style="text-align:center;padding:20px;color:#94a3b8;">
CodeGenie AI © 2026 | AI-Powered Code Generation & Explanation Platform
</footer>
<script src="{{ url_for('static', filename='theme.js') }}"></script>

</body>
</html>
