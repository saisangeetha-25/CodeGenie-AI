<!DOCTYPE html>
<html>
<head>
<title>CodeGenie AI - Select Role</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#0f172a;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

.container{
    width:700px;
    background:#1e293b;
    padding:50px;
    border-radius:20px;
    text-align:center;

    border:1px solid rgba(0,195,255,0.3);

    box-shadow:
    0 0 20px rgba(0,195,255,0.15),
    0 0 40px rgba(0,195,255,0.08);
}

.logo{
    color:#00c3ff;
    font-size:40px;
    font-weight:bold;
    margin-bottom:10px;
}

.tagline{
    color:#cbd5e1;
    margin-bottom:40px;
}

.option-box{
    display:flex;
    gap:30px;
    justify-content:center;
}

.box{
    flex:1;
    padding:40px 20px;
    border-radius:18px;
    cursor:pointer;
    transition:0.3s;

    background:#111827;

    border:1px solid rgba(0,195,255,0.25);
}

.box:hover{
    transform:translateY(-8px);

    box-shadow:
    0 0 15px rgba(0,195,255,0.4),
    0 0 30px rgba(0,195,255,0.2);
}

.icon{
    font-size:50px;
    margin-bottom:15px;
}

.role-title{
    color:#00c3ff;
    font-size:24px;
    margin-bottom:10px;
}

.role-desc{
    color:#cbd5e1;
    font-size:14px;
}

.footer-text{
    margin-top:35px;
    color:#94a3b8;
    font-size:14px;
}

</style>

</head>

<body>

<div class="container">

    <div class="logo">
        CODEGENIE AI
    </div>

    <div class="tagline">
        AI-Powered Code Generation and Explanation Platform
    </div>

    <div class="option-box">

        <div class="box" onclick="goUser()">

            <div class="icon">👤</div>

            <div class="role-title">
                User Login
            </div>

            <div class="role-desc">
                Explore AI-powered coding assistance and generate relative codes.
            </div>

        </div>

        <div class="box" onclick="goAdmin()">

            <div class="icon">🛡️</div>

            <div class="role-title">
                Admin Login
            </div>

            <div class="role-desc">
                Access administrative controls, user management and platform analytics.
            </div>

        </div>

    </div>

    <div class="footer-text">
        Choose your role to continue
    </div>

</div>

<script>

function goUser(){
    window.location.href="/login";
}

function goAdmin(){
    window.location.href="/admin_login";
}

</script>


<script src="{{ url_for('static', filename='theme.js') }}"></script>
</body>
</html>
