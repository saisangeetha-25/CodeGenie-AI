<!DOCTYPE html>
<html>
<head>

<title>CodeGenie AI - User History</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#0f172a;
color:white;
min-height:100vh;
}

.header{
background:#1e293b;
padding:20px;
text-align:center;
border-bottom:1px solid rgba(0,195,255,0.3);
}

.header h1{
color:#00c3ff;
}

.container{
width:90%;
max-width:1200px;
margin:30px auto;
}

.back-btn{
display:inline-block;
padding:10px 18px;
background:#00c3ff;
color:white;
text-decoration:none;
border-radius:8px;
margin-bottom:20px;
}

.back-btn:hover{
background:#009ad6;
}

.search-card{
background:#1e293b;
padding:20px;
border-radius:15px;
margin-bottom:25px;
border:1px solid rgba(0,195,255,0.2);
}

.search-form{
display:flex;
gap:10px;
}

.search-form input{
flex:1;
padding:12px;
background:#111827;
color:white;
border:1px solid #334155;
border-radius:10px;
}

.search-form button{
padding:12px 20px;
background:#00c3ff;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
}

.search-form button:hover{
background:#009ad6;
}

.history-card{
background:#1e293b;
padding:25px;
border-radius:15px;
margin-bottom:20px;
border:1px solid rgba(0,195,255,0.2);
}

.label{
color:#00c3ff;
font-weight:bold;
margin-bottom:5px;
}

.section{
margin-bottom:15px;
}

.code-box{
background:#111827;
padding:15px;
border-radius:10px;
overflow:auto;
white-space:pre-wrap;
}

.empty{
text-align:center;
font-size:18px;
margin-top:40px;
color:#cbd5e1;
}

/* ==========================
   LIGHT MODE
========================== */

body.light-mode{
    background:#f4f7fb;
    color:#111827;
}

body.light-mode .header{
    background:white;
    border-bottom:1px solid #dbeafe;
}

body.light-mode .search-card{
    background:white;
    color:#111827;
    border:1px solid #dbeafe;
    box-shadow:0 0 10px rgba(0,0,0,0.08);
}

body.light-mode .history-card{
    background:white;
    color:#111827;
    border:1px solid #dbeafe;
    box-shadow:0 0 10px rgba(0,0,0,0.08);
}

body.light-mode .search-form input{
    background:#f8fafc;
    color:#111827;
    border:1px solid #d1d5db;
}

body.light-mode .code-box{
    background:#f8fafc;
    color:#111827;
    border:1px solid #d1d5db;
}

body.light-mode pre{
    color:#111827;
}

body.light-mode .empty{
    color:#475569;
}

</style>

</head>

<body>

<div class="header">
<h1>📜 User History</h1>
</div>

<div class="container">

<a href="/admin_dashboard" class="back-btn">
← Back to Dashboard
</a>

<div class="search-card">

<form method="GET" class="search-form">

<input
type="text"
name="user"
placeholder="Search by username">

<button type="submit">
Search
</button>

</form>

</div>

{% if records|length == 0 %}

<div class="empty">
No records found.
</div>

{% endif %}

{% for r in records %}

<div class="history-card">

<div class="section">
<div class="label">👤 User</div>
{{ r.username }}
</div>

<div class="section">
<div class="label">❓ Question</div>
{{ r.question }}
</div>

<div class="section">
<div class="label">💻 Generated Code</div>
<div class="code-box">
<pre>{{ r.code }}</pre>
</div>
</div>

</div>

{% endfor %}

</div>
<script src="{{ url_for('static', filename='theme.js') }}"></script>
</body>
</html>
