<!DOCTYPE html>
<html>
<head>
<title>Bookmarks | CodeGenie AI</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#0f172a;
    color:white;
    min-height:100vh;
}

.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 40px;
    background:#111827;
    border-bottom:1px solid rgba(0,195,255,0.3);
}

.logo{
    color:#00c3ff;
    font-size:24px;
    font-weight:bold;
}

.back-btn{
    text-decoration:none;
    background:#00c3ff;
    color:white;
    padding:10px 18px;
    border-radius:8px;
    transition:0.3s;
}

.back-btn:hover{
    background:#009ad6;
}

.container{
    width:90%;
    max-width:1000px;
    margin:40px auto;
}

.page-title{
    text-align:center;
    color:#00c3ff;
    margin-bottom:35px;
    font-size:32px;
}

.empty-bookmarks{
    text-align:center;
    margin-top:50px;
    color:#cbd5e1;
    font-size:20px;
}

.card{
    background:#1e293b;
    padding:25px;
    margin-bottom:25px;
    border-radius:15px;
    border:1px solid rgba(0,195,255,0.25);
    box-shadow:0 0 15px rgba(0,195,255,0.1);
}

.card-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.bookmark-badge{
    background:#00c3ff;
    padding:6px 12px;
    border-radius:20px;
    font-size:14px;
    font-weight:bold;
}

.timestamp{
    color:#94a3b8;
    font-size:14px;
}

.code-title{
    color:#00c3ff;
    margin-bottom:10px;
}

pre{
    background:#111827;
    padding:15px;
    border-radius:10px;
    overflow:auto;
    white-space:pre-wrap;
    word-wrap:break-word;
}

/* ==========================
   LIGHT MODE
========================== */

body.light-mode{
    background:#f4f7fb;
    color:#111827;
}

body.light-mode .top-bar{
    background:white;
    border-bottom:1px solid #dbeafe;
}

body.light-mode .card{
    background:white;
    color:#111827;
    border:1px solid #dbeafe;
    box-shadow:0 0 10px rgba(0,0,0,0.08);
}

body.light-mode pre{
    background:#f8fafc;
    color:#111827;
}

body.light-mode .empty-bookmarks{
    color:#475569;
}

body.light-mode .timestamp{
    color:#64748b;
}

</style>
</head>

<body>

<div class="top-bar">

    <div class="logo">
        CODEGENIE AI
    </div>

    <a href="/home" class="back-btn">
        ← Dashboard
    </a>

</div>

<div class="container">

    <h1 class="page-title">
        ⭐ Saved Bookmarks
    </h1>

    {% if records|length == 0 %}

    <div class="empty-bookmarks">
        No bookmarked code yet ⭐
    </div>

    {% endif %}

    {% for item in records %}

    <div class="card">

        <div class="card-header">

            <div class="bookmark-badge">
                BOOKMARKED
            </div>

            <div class="timestamp">
                {{ item["created_at"] }}
            </div>

        </div>

        <h3 class="code-title">
            Saved Code
        </h3>

        <pre>{{ item["code"] }}</pre>

    </div>

    {% endfor %}

</div>

<footer style="text-align:center;padding:20px;color:#94a3b8;">
CodeGenie AI © 2026 | AI-Powered Code Generation & Explanation Platform
</footer>

<script src="{{ url_for('static', filename='theme.js') }}"></script>
</body>
</html>
